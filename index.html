<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZeroNote</title><style>
:root{font-family:Inter,'Segoe UI',system-ui,sans-serif;color:#252d38;background:#fafbfe;--accent:#6558b7;--border:#e2e5ee;--muted:#6e7584}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid #9e92ee;outline-offset:2px}button{border:0}#app{height:100%;display:grid;grid-template-columns:190px 190px 220px minmax(250px,1fr)}.side{overflow:auto;border-right:1px solid var(--border);min-height:0}.books{background:#26233b;color:#f4f2ff}.sections{background:#f2effa}.pages{background:#f8f8fd}.brand{padding:19px 15px 16px;display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:-.4px;font-size:18px}.logo{display:grid;place-items:center;width:31px;height:31px;background:linear-gradient(135deg,#ac9eff,#6753b8);border-radius:10px;color:#fff}.subhead{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;color:#8d849f;padding:16px 13px 9px}.books .subhead{color:#aea8c2}.sidebtn{width:calc(100% - 14px);margin:2px 7px;display:flex;align-items:center;gap:9px;padding:11px 10px;border-radius:9px;text-align:left;background:transparent;color:inherit;font-size:12px;overflow-wrap:anywhere}.sidebtn:hover{background:#9992b020}.sidebtn.active{background:#ded8ff;color:#453b8d;font-weight:750}.books .sidebtn.active{background:#615784;color:#fff}.sidebtn .dot{width:9px;height:9px;border-radius:3px;background:#a18be5;flex:none}.sidebtn .glyph{width:20px;text-align:center;font-size:16px}.sidebtn span:nth-child(2){min-width:0;overflow-wrap:anywhere}.sidebtn .count{margin-left:auto;color:#8c87a0;font-size:10px}.sidebtn.add{border:1px dashed #bdb6d1;color:inherit;justify-content:center;margin-top:11px}.books .sidebtn.add{border-color:#706a8a}.section-head{padding:20px 14px 12px;font-size:16px;font-weight:800}.search{margin:6px 11px 11px;width:calc(100% - 22px);border:1px solid var(--border);background:#fff;padding:10px 12px;border-radius:9px;font-size:12px}.page{padding:12px;display:block!important;position:relative}.page strong{display:block;font-size:12px;line-height:1.3}.page small{display:block;color:var(--muted);font-size:10px;margin-top:5px;line-height:1.4}.page.active{background:#ece7ff;border-left:3px solid #7969d4}.editor{display:flex;flex-direction:column;overflow:hidden;min-height:0;background:white}.topbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 18px;background:#f9f8fd;border-bottom:1px solid var(--border)}.tool{min-width:30px;min-height:29px;padding:6px 9px;border-radius:7px;background:white;color:#504665;border:1px solid #e0dce9;font-size:12px}.tool:hover{background:#eae5ff}.tool.primary{background:#6755b3;color:white;border-color:#6755b3}.tool.danger{color:#ae4462}.tool:disabled{opacity:.35;cursor:default}.grow{flex:1}.toolbar-group{display:flex;gap:4px;align-items:center}.editwrap{overflow:auto;flex:1;min-height:0;padding:28px clamp(18px,4vw,55px) 60px}.crumb{font-size:11px;color:#918b9b;min-height:18px}.pagetitle{font-weight:780;font-size:clamp(24px,3vw,32px);border:0;background:transparent;width:100%;margin:16px 0 0;padding:0;color:#272737;outline:0;min-width:0}.date{font-size:11px;color:#9996a4;padding:9px 0 18px;border-bottom:1px solid #eae7ef}.body{min-height:240px;max-width:850px;font-size:15px;line-height:1.8;margin-top:22px;outline:0;overflow-wrap:anywhere;white-space:normal}.body:empty:before{content:'Start writing here…';color:#bab6c3;pointer-events:none}.body img{max-width:100%}.body table{border-collapse:collapse}.body td,.body th{border:1px solid #dad6e4;padding:7px}.body a{color:#6558b7}.status{display:flex;align-items:center;gap:8px;padding:8px 17px;border-top:1px solid var(--border);color:#787185;font-size:11px;background:#faf9fd}.pill{background:#ece8fa;padding:4px 8px;border-radius:20px;color:#6655a5;font-size:10px}.notice{margin:12px 16px;padding:10px 12px;border-radius:10px;background:#fff4da;border:1px solid #f2dfaf;color:#785f32;font-size:11px;line-height:1.45}.hidden{display:none!important}.mobileTabs{display:none}.empty{font-size:12px;color:var(--muted);padding:20px}.menu{display:flex;gap:6px;padding:0 11px 10px}.menu button{border:1px solid #ddd7ea;background:#fff;border-radius:8px;padding:7px 9px;color:#625677;font-size:11px;flex:1}.smlabel{font-size:11px;color:#9b94a8;padding:11px 12px}.bookfooter{margin-top:25px;padding:14px;border-top:1px solid #5b566d;font-size:11px;color:#c3bfd2}.bookfooter button{color:#f5f3ff;background:#49435e;border-radius:8px;padding:8px 10px;width:100%;margin:3px 0;text-align:left;font-size:11px}#toast{position:fixed;bottom:35px;right:20px;z-index:20;background:#28243e;color:white;border-radius:11px;padding:11px 15px;max-width:330px;box-shadow:0 12px 40px #1114;font-size:12px;display:none}.modalback{position:fixed;inset:0;z-index:50;background:#17121a99;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:white;max-width:460px;width:100%;border-radius:17px;padding:23px;box-shadow:0 20px 90px #0004}.modal h2{margin:0 0 10px;font-size:19px}.modal p{font-size:12px;color:var(--muted);line-height:1.6}.modal input{width:100%;border-radius:9px;border:1px solid var(--border);padding:12px;margin:12px 0}.modal .actions{display:flex;gap:8px;justify-content:flex-end}.modal .actions button{padding:9px 15px;border-radius:9px;background:#eee9f9}.modal .actions button.ok{color:white;background:var(--accent)}@media(max-width:950px){#app{grid-template-columns:145px 145px 185px minmax(210px,1fr)}.brand{font-size:15px}.tool{padding:6px}}@media(max-width:690px){body{overflow:hidden}#app{grid-template-columns:1fr;height:calc(100% - 47px)}.side,.editor{display:none}.side.mobile-active,.editor.mobile-active{display:flex;flex-direction:column;border-right:0}.side.mobile-active{display:block}.mobileTabs{display:flex;position:fixed;bottom:0;left:0;right:0;height:47px;background:#f7f5fc;border-top:1px solid var(--border);z-index:5}.mobileTabs button{flex:1;background:transparent;color:#6f6285}.mobileTabs button.active{background:#e6e0fa;color:#423a82;font-weight:700}.editwrap{padding:19px 17px 55px}.topbar{padding:8px;max-height:110px;overflow:auto}.books{background:#28253d}.bookfooter{margin-top:20px}}
</style></head><body><div id="app"><aside class="side books" id="booksPanel"><div class="brand"><span class="logo">N</span>ZeroNote</div><div class="subhead">Notebooks</div><div id="booksList"></div><button class="sidebtn add" id="addBook">+ New notebook</button><div class="bookfooter"><button id="exportBackup">↓ Export all notes (.json)</button><button id="importBackup">↑ Restore a backup</button><input id="backupFile" type="file" accept=".json,application/json" hidden><button id="help">? Storage & help</button></div></aside><aside class="side sections" id="sectionsPanel"><div class="section-head" id="bookHeading">Sections</div><div id="sectionsList"></div><button class="sidebtn add" id="addSection">+ New section</button><div class="menu"><button id="renameBook">Rename notebook</button><button id="removeBook">Delete</button></div></aside><aside class="side pages" id="pagesPanel"><div class="section-head" id="sectionHeading">Pages</div><input class="search" id="search" type="search" placeholder="Search all notes…"><div id="pagesList"></div><button class="sidebtn add" id="addPage">+ New page</button><div class="menu"><button id="renameSection">Rename section</button><button id="removeSection">Delete</button></div></aside><main class="editor" id="editorPanel"><div class="topbar"><div class="toolbar-group"><button class="tool" data-cmd="bold" title="Bold"><b>B</b></button><button class="tool" data-cmd="italic" title="Italic"><i>I</i></button><button class="tool" data-cmd="underline" title="Underline"><u>U</u></button><button class="tool" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button></div><div class="toolbar-group"><button class="tool" data-cmd="insertUnorderedList" title="Bullet list">☷</button><button class="tool" data-cmd="insertOrderedList" title="Numbered list">1.</button><button class="tool" id="checklist" title="Add checkbox">☑</button><button class="tool" id="link" title="Insert link">🔗</button></div><div class="grow"></div><button class="tool" id="downloadPage">↓ Page</button><button class="tool" id="deletePage">Delete</button></div><div id="storageNotice" class="notice hidden"></div><div class="editwrap"><div class="crumb" id="crumb"></div><input class="pagetitle" id="pageTitle" placeholder="Untitled page" maxlength="160"><div class="date" id="date"></div><div class="body" id="body" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Note content"></div></div><div class="status"><span id="saveStatus">Ready</span><span class="grow"></span><span class="pill" id="wordCount">0 words</span></div></main></div><nav class="mobileTabs" id="tabs"><button data-tab="books" class="active">Notebooks</button><button data-tab="sections">Sections</button><button data-tab="pages">Pages</button><button data-tab="editor">Editor</button></nav><div id="toast" role="status"></div><div id="modalRoot"></div><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='zeronote-data-v1',now=()=>new Date().toISOString(),uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>{const b=uid(),s=uid(),p=uid();return {version:1,books:[{id:b,name:'My Notebook',sections:[{id:s,name:'Quick Notes',pages:[{id:p,title:'Welcome to ZeroNote',html:'<p>Welcome! Create notebooks, sections, and pages to organize your ideas.</p><p><b>Tip:</b> The poagyDesktop Bridge uses an isolated app frame. If automatic saving is unavailable, export a backup before closing ZeroNote.</p><ul><li>Use the formatting toolbar above.</li><li>Use Export all notes to save a portable backup.</li><li>Restore a backup when you return.</li></ul>',updated:now()}]}]}]}};
let state,bookId,sectionId,pageId,searchValue='',timer=null,storageWorks=false,lastSaved='',lastFocus=null;
try{localStorage.setItem('__zeronote_test','yes');localStorage.removeItem('__zeronote_test');storageWorks=true}catch(e){}
try{state=storageWorks?JSON.parse(localStorage.getItem(KEY)||'null'):null}catch(e){}if(!state||!Array.isArray(state.books))state=initial();
const book=()=>state.books.find(b=>b.id===bookId),section=()=>book()?.sections.find(s=>s.id===sectionId),page=()=>section()?.pages.find(p=>p.id===pageId);
function normalize(){if(!state.books.length)state=initial();bookId=state.books.some(b=>b.id===bookId)?bookId:state.books[0].id;let b=book();if(!b.sections.length)b.sections.push({id:uid(),name:'New section',pages:[]});sectionId=b.sections.some(s=>s.id===sectionId)?sectionId:b.sections[0].id;let s=section();pageId=s.pages.some(p=>p.id===pageId)?pageId:(s.pages[0]?.id||null)}normalize();
let toastTimer;function toast(m){$('toast').textContent=m;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',3500)}
function save(){clearTimeout(timer);try{if(storageWorks){localStorage.setItem(KEY,JSON.stringify(state));$('saveStatus').textContent='Saved on this device';}else $('saveStatus').textContent='In memory only — export a backup';lastSaved=now()}catch(e){storageWorks=false;warn();$('saveStatus').textContent='Storage unavailable — export a backup';}}
function scheduleSave(){ $('saveStatus').textContent='Editing…';clearTimeout(timer);timer=setTimeout(save,500)}
function warn(){let el=$('storageNotice');el.classList.toggle('hidden',storageWorks);if(!storageWorks)el.textContent='This app is sandboxed, so automatic storage is unavailable. Notes will be lost when the app closes unless you export a .json backup. Use “Export all notes” in the Notebooks sidebar.';}
function selectedButton(name,active,cb){const el=document.createElement('button');el.className='sidebtn'+(active?' active':'');el.innerHTML=name;el.onclick=cb;return el;}
function renderNav(){let books=$('booksList'),sections=$('sectionsList'),pages=$('pagesList');books.replaceChildren();sections.replaceChildren();pages.replaceChildren();for(const b of state.books){let el=selectedButton('<span class="glyph">▣</span><span>'+escapeHTML(b.name)+'</span>',b.id===bookId,()=>{flush();bookId=b.id;normalize();render();switchTab('sections')});books.append(el)}$('bookHeading').textContent=book()?.name||'Sections';for(const s of book().sections){let el=selectedButton('<span class="dot"></span><span>'+escapeHTML(s.name)+'</span>',s.id===sectionId,()=>{flush();sectionId=s.id;normalize();render();switchTab('pages')});sections.append(el)}$('sectionHeading').textContent=searchValue?'Search results':section()?.name||'Pages';let entries=[];if(searchValue){for(const b of state.books)for(const s of b.sections)for(const p of s.pages){const q=(p.title+' '+p.html.replace(/<[^>]*>/g,' ')).toLowerCase();if(q.includes(searchValue.toLowerCase()))entries.push({b,s,p})}}else entries=section().pages.map(p=>({b:book(),s:section(),p}));entries.sort((a,b)=>b.p.updated.localeCompare(a.p.updated));for(const {b,s,p} of entries){let snippet=p.html.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();let el=selectedButton('<strong>'+escapeHTML(p.title||'Untitled')+'</strong><small>'+escapeHTML((searchValue?b.name+' / '+s.name+' · ':'')+snippet.slice(0,100))+'</small>',p.id===pageId,()=>{flush();bookId=b.id;sectionId=s.id;pageId=p.id;render();switchTab('editor')});el.classList.add('page');pages.append(el)}if(!entries.length){let el=document.createElement('div');el.className='empty';el.textContent=searchValue?'No matches found.':'No pages yet.';pages.append(el)}}
function renderEditor(){const p=page();const enabled=!!p;for(const el of [$('pageTitle'),$('downloadPage'),$('deletePage')])el.disabled=!enabled;$('body').setAttribute('contenteditable',String(enabled));$('pageTitle').value=p?.title||'';$('body').innerHTML=p?.html||'';$('crumb').textContent=enabled?book().name+'  ›  '+section().name:'Create a page to get started';$('date').textContent=enabled?'Last edited '+new Date(p.updated).toLocaleString():'';countWords();warn()}
function render(){normalize();renderNav();renderEditor()}
function flush(){const p=page();if(p){p.title=$('pageTitle').value.trim()||'Untitled page';p.html=sanitize($('body').innerHTML);p.updated=now();save()}}
function countWords(){const t=$('body').innerText||'';$('wordCount').textContent=(t.trim()?t.trim().split(/\s+/).length:0)+' words'}
function editorChanged(){const p=page();if(!p)return;p.html=sanitize($('body').innerHTML);p.updated=now();$('date').textContent='Last edited '+new Date(p.updated).toLocaleString();countWords();scheduleSave()}
function download(filename,data,type='application/json'){const blob=new Blob([data],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function safeName(s){return String(s).replace(/[^a-z0-9_ -]/gi,'').trim().replace(/\s+/g,'-').slice(0,60)||'notes'}
function sanitize(html){const doc=new DOMParser().parseFromString('<div>'+String(html)+'</div>','text/html');const root=doc.body.firstElementChild;const allowed=new Set(['P','BR','B','STRONG','I','EM','U','S','STRIKE','UL','OL','LI','BLOCKQUOTE','H1','H2','H3','H4','DIV','SPAN','A','INPUT','TABLE','TBODY','THEAD','TR','TD','TH','PRE','CODE']);function clean(el){for(const child of [...el.childNodes]){if(child.nodeType===8){child.remove();continue}if(child.nodeType!==1)continue;if(!allowed.has(child.tagName)){const frag=doc.createDocumentFragment();while(child.firstChild)frag.append(child.firstChild);child.replaceWith(frag);clean(el);continue}const href=child.tagName==='A'?child.getAttribute('href'):null;for(const attr of [...child.attributes])child.removeAttribute(attr.name);if(child.tagName==='A'){if(href&&/^https?:\/\//i.test(href))child.setAttribute('href',href)}if(child.tagName==='INPUT'){child.setAttribute('type','checkbox');child.setAttribute('disabled','');}clean(child)}}clean(root);return root.innerHTML}
// Custom prompt rather than browser prompt for a smoother embedded experience.
function ask(title,value='',hint=''){return new Promise(resolve=>{const root=$('modalRoot');root.innerHTML='<div class="modalback"><div class="modal"><h2>'+escapeHTML(title)+'</h2><p>'+escapeHTML(hint)+'</p><input maxlength="160"><div class="actions"><button data-no>Cancel</button><button class="ok" data-yes>Save</button></div></div></div>';const input=root.querySelector('input');input.value=value;setTimeout(()=>{input.focus();input.select()},20);function done(v){root.replaceChildren();resolve(v)}root.querySelector('[data-no]').onclick=()=>done(null);root.querySelector('[data-yes]').onclick=()=>done(input.value.trim()||null);input.onkeydown=e=>{if(e.key==='Enter')done(input.value.trim()||null);if(e.key==='Escape')done(null)}})}
async function confirmDelete(message){return new Promise(resolve=>{const root=$('modalRoot');root.innerHTML='<div class="modalback"><div class="modal"><h2>Delete?</h2><p>'+escapeHTML(message)+'</p><div class="actions"><button data-no>Cancel</button><button class="ok" data-yes>Delete</button></div></div></div>';const done=v=>{root.replaceChildren();resolve(v)};root.querySelector('[data-no]').onclick=()=>done(false);root.querySelector('[data-yes]').onclick=()=>done(true)})}
$('addBook').onclick=async()=>{let name=await ask('New notebook','','Give your notebook a name.');if(!name)return;flush();let b={id:uid(),name,sections:[{id:uid(),name:'General',pages:[]}]};state.books.push(b);bookId=b.id;normalize();save();render();switchTab('sections')};
$('addSection').onclick=async()=>{let name=await ask('New section');if(!name)return;flush();let s={id:uid(),name,pages:[]};book().sections.push(s);sectionId=s.id;normalize();save();render();switchTab('pages')};
$('addPage').onclick=()=>{flush();const p={id:uid(),title:'Untitled page',html:'',updated:now()};section().pages.push(p);pageId=p.id;save();render();switchTab('editor');$('pageTitle').focus();$('pageTitle').select()};
$('renameBook').onclick=async()=>{let name=await ask('Rename notebook',book().name);if(name){book().name=name;save();render()}};
$('renameSection').onclick=async()=>{let name=await ask('Rename section',section().name);if(name){section().name=name;save();render()}};
$('removeBook').onclick=async()=>{if(!await confirmDelete('Delete this notebook and all its sections and pages?'))return;state.books=state.books.filter(b=>b.id!==bookId);normalize();save();render()};
$('removeSection').onclick=async()=>{if(!await confirmDelete('Delete this section and all its pages?'))return;book().sections=book().sections.filter(s=>s.id!==sectionId);normalize();save();render()};
$('deletePage').onclick=async()=>{if(!page()||!await confirmDelete('Delete this page?'))return;section().pages=section().pages.filter(p=>p.id!==pageId);normalize();save();render()};
$('pageTitle').oninput=()=>{if(!page())return;page().title=$('pageTitle').value||'Untitled page';page().updated=now();scheduleSave()};$('pageTitle').onchange=renderNav;
$('body').oninput=editorChanged;$('body').addEventListener('paste',e=>{e.preventDefault();const text=e.clipboardData.getData('text/plain');document.execCommand('insertText',false,text)});
for(const btn of document.querySelectorAll('[data-cmd]'))btn.addEventListener('click',()=>{if(!page())return;$('body').focus();document.execCommand(btn.dataset.cmd,false,null);editorChanged()});
$('checklist').onclick=()=>{if(!page())return;$('body').focus();document.execCommand('insertHTML',false,'<p>☐ &nbsp; Task</p>');editorChanged()};
$('link').onclick=async()=>{if(!page())return;const u=await ask('Insert link','https://','Only http:// or https:// URLs are supported.');if(!u||!/^https?:\/\//i.test(u)){toast('Enter an http(s) link.');return}$('body').focus();document.execCommand('createLink',false,u);editorChanged()};
$('search').oninput=e=>{searchValue=e.target.value;renderNav();switchTab('pages')};
$('exportBackup').onclick=()=>{flush();download('ZeroNote-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2));toast('Backup downloaded. Keep it somewhere safe.')};
$('downloadPage').onclick=()=>{flush();const p=page();if(!p)return;const html='<!doctype html><html><head><meta charset="utf-8"><title>'+escapeHTML(p.title)+'</title></head><body><h1>'+escapeHTML(p.title)+'</h1>'+sanitize(p.html)+'</body></html>';download(safeName(p.title)+'.html',html,'text/html')};
$('importBackup').onclick=()=>$('backupFile').click();$('backupFile').onchange=async e=>{let file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>6000000){toast('Backup is too large (6 MB maximum).');return}try{const obj=JSON.parse(await file.text());if(obj.version!==1||!Array.isArray(obj.books)||obj.books.length>300)throw Error('Unsupported backup');let total=0;for(const b of obj.books){if(typeof b.id!=='string'||typeof b.name!=='string'||!Array.isArray(b.sections))throw Error('Invalid notebook');for(const s of b.sections){if(typeof s.id!=='string'||typeof s.name!=='string'||!Array.isArray(s.pages))throw Error('Invalid section');for(const p of s.pages){if(typeof p.id!=='string'||typeof p.title!=='string'||typeof p.html!=='string'||typeof p.updated!=='string')throw Error('Invalid page');p.html=sanitize(p.html);if(++total>20000)throw Error('Too many pages')}}}if(!await confirmDelete('Replace all current notes with the imported backup? Export your current notes first if needed.'))return;state=obj;bookId=sectionId=pageId=null;normalize();save();render();toast('Backup restored: '+total+' pages.')}catch(error){toast('Import failed: '+error.message)}};
$('help').onclick=()=>{const root=$('modalRoot');root.innerHTML='<div class="modalback"><div class="modal"><h2>ZeroNote storage</h2><p>ZeroNote runs in an isolated poagyDesktop iframe. The browser may block localStorage. When blocked, your changes only live in memory until you export them. The Bridge currently supports app installation, not saving notes to desktop files.</p><p><b>Backup:</b> Use Export all notes (.json), and Restore a backup next time. The file contains your entire notebook library.</p><p><b>Microsoft OneNote:</b> This is an independent note-taking app, not an official OneNote client. It does not sync with Microsoft.</p><div class="actions"><button class="ok" data-yes>Close</button></div></div></div>';root.querySelector('[data-yes]').onclick=()=>root.replaceChildren()};
function switchTab(name){const match=window.matchMedia('(max-width:690px)').matches;for(const [n,id] of [['books','booksPanel'],['sections','sectionsPanel'],['pages','pagesPanel'],['editor','editorPanel']])$(id).classList.toggle('mobile-active',!match||n===name);for(const btn of $('tabs').querySelectorAll('button'))btn.classList.toggle('active',btn.dataset.tab===name)}$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)switchTab(b.dataset.tab)});window.addEventListener('resize',()=>switchTab(document.querySelector('#tabs .active')?.dataset.tab||'editor'));
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();flush();toast('Current notes saved / ready for export')} });window.addEventListener('beforeunload',()=>{flush()});
render();switchTab('editor');if(!storageWorks)warn();
})();
</script></body></html>
